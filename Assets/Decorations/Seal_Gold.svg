<!-- Seal_Gold.svg: simple decorative golden seal -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="g" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#F7E6C9"/>
      <stop offset="100%" stop-color="#B98A5D"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="200" fill="url(#g)" stroke="#8F6536" stroke-width="6"/>
  <g transform="translate(90,120) scale(0.9)" fill="#7A4F2B" font-family="serif" font-size="36">
    <text x="40" y="70">印</text>
    <text x="120" y="70">章</text>
  </g>
</svg>